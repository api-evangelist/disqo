certifications:
  published: false
  evidence: >-
    No trust center, no /security or /trust page (both 404 on www.disqo.com), and
    no SOC 2 / ISO 27001 / HIPAA / PCI / FedRAMP claim found on disqo.com or in
    search. probe-security-programs.py returned vdp=none trust=none on
    2026-08-04. DISQO publishes a privacy policy and marketing collateral about
    panel trust and data quality, which is not a certification claim.
regulatory_context:
  note: >-
    DISQO handles first-party consumer behavioural and demographic data at scale,
    which places it squarely in CCPA/CPRA and GDPR territory, and the Audience API
    passes demographic attributes (age, gender, state, postal code, ethnicity,
    Hispanic origin, household income, employment, job title) through the entry
    link query string. No published compliance posture backs that data flow.
  privacy_policy: https://www.disqo.com/privacy-policy/
gaps_to_push_back_to_provider:
- >-
  Publish an OpenAPI 3.1 description of the Audience, Feasibility and Custom
  Questions APIs at a stable anonymous URL. The Postman collection proves the
  contract is already modelled internally.
- >-
  Publish /.well-known/security.txt (RFC 9116) with a security contact and
  disclosure policy.
- >-
  Publish a trust/compliance page naming actual certifications. A first-party
  consumer-data business with no public compliance posture is a procurement
  blocker.
- >-
  Enable HSTS on www.disqo.com, developer.disqo.com and the API hosts, and add
  CAA records to disqo.com.
- >-
  Demographic attributes are passed on the entry-link query string. Query strings
  land in logs, referrers and browser history — consider moving them to a
  server-side lookup keyed by tid.
