model: >-
  DISQO runs a full parallel DEMO environment on a separate registrable domain
  (disqo-demo.com) rather than a test-mode flag or a key prefix on production.
  Credentials for DEMO are distinct from production and are issued by a named
  integration contact — there is no self-service signup, no test key prefix, and
  no publicly published test credentials.
