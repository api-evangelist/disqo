assisted_testing:
  description: >-
    Once a project exists in DEMO and the hash has been tested, the integrator
    notifies the DISQO Customer Success team, who send a real test panelist
    through the flow to confirm the redirects behave as expected.
  human_in_the_loop: true
  source: https://developer.disqo.com/docs/audience-api/
magic_values:
  published: false
  note: >-
    DISQO publishes no magic test identifiers, seeded test panelist IDs, or
    deterministic feasibility fixtures. Testing depends on the DEMO environment
    plus a human-dispatched test panelist.
time_simulation:
  supported: false
gaps_to_push_back_to_provider:
- >-
  No self-service sandbox. Every DEMO credential requires a human at DISQO, which
  blocks evaluation before a sales conversation and blocks any automated or agent
  driven integration.
- >-
  No published magic/test values (test panelist IDs, deterministic feasibility
  responses, forced status/substatus triggers), so an integrator cannot unit-test
  the nine callback status codes or the eight substatus codes without DISQO
  dispatching a live person.
- >-
  DEMO lives on a separate registrable domain (disqo-demo.com) rather than a
  subdomain of disqo.com — worth confirming its DNS/TLS posture is held to the
  same standard as the production domain.
