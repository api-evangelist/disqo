aid: disqo
name: DISQO
description: 'DISQO is a Glendale, California consumer-insights and advertising-measurement
  company that operates a first-party, fully opted-in consumer panel and sells programmatic
  access to it. Its public API surface is the DISQO Audience API — a RESTful, HTTP
  Basic authenticated set of services for checking sample feasibility, creating and
  managing survey projects and quotas, attaching custom screening questions, and managing
  included/excluded panelist and project lists — plus a redirect/callback tracking
  contract that returns panelists to DISQO with an HMAC-SHA256 signed status. A separate
  CoReg API validates email addresses for co-registration flows. DISQO also sells Brand
  Lift, Outcomes Lift, Research Management and cross-platform ad measurement products
  on top of the same panel.'
url: https://raw.githubusercontent.com/api-evangelist/disqo/refs/heads/main/apis.yml
