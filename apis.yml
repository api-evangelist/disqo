apis:
- name: DISQO Audience Projects API
  description: 'Create, list, retrieve, update and delete survey Projects and their
    Quotas against the DISQO panel, and manage the included-users, excluded-users and
    excluded-projects lists that drive recontact and wave studies. Projects carry completesWanted,
    conversionRate, cpi, country, devices, loi, studyType, supplierId and a qualifications
    set drawn from over 100 panelist attributes.'
  humanURL: https://developer.disqo.com/docs/audience-api/
  baseURL: https://projects-api.audience.disqo.com
  tags:
  - Project
  - Quotas
  - Surveys
  - Audience
  tags_raw:
  - Projects
  - Quotas
  - Surveys
  - Audience
