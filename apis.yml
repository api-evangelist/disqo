  - type: Sandbox
    url: sandbox/disqo-sandbox.yml
  - type: DataModel
    url: data-model/disqo-data-model.yml
- name: DISQO Audience Feasibility API
  description: 'Estimate the number of panelists — feasible completes — available for
    a given set of qualifications, country, device mix, length of interview and incidence
    rate before a project is created and fielded.'
  humanURL: https://developer.disqo.com/docs/audience-api/
  baseURL: https://feasibility-api.audience.disqo.com
  tags:
  - Feasibility
  - Audience
  - Surveys
  properties:
  - type: Documentation
    url: https://developer.disqo.com/docs/audience-api/
- name: DISQO Audience Custom Questions API
  description: 'List, retrieve and create client-specific custom screening questions
    that can be attached to a project as pre-screening qualifications beyond the standard
    DISQO panelist attribute library.'
  humanURL: https://developer.disqo.com/docs/audience-api/
  baseURL: https://custom-questions-api.audience.disqo.com
  tags:
  - Custom Questions
  - Audience
  - Surveys
  properties:
  - type: Documentation
    url: https://developer.disqo.com/docs/audience-api/
- name: DISQO CoReg API
  description: 'Validate an email address for co-registration flows — checks address
    format, whether the address already exists in the DISQO system, and optionally
    runs an Email Oversight verification. Authenticated with an ApiKey authorization
    header.'
  humanURL: https://developer.disqo.com/docs/coreg-api/
  baseURL: https://coreg.us.sjapis.com/api
  tags:
  - Email Validation
  - CoReg
  - Identity
  properties:
  - type: Documentation
    url: https://developer.disqo.com/docs/coreg-api/
  - type: Authentication
    url: authentication/disqo-authentication.yml
