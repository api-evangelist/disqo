gaps_to_push_back_to_provider:
- >-
  Ship an official Audience API client for at least JavaScript/TypeScript and
  Python and publish it to npm and PyPI. The API's users are research-ops and
  panel-integration engineers, and today every one of them writes their own HTTP
  Basic wrapper and HMAC-SHA256 signer from the Slate docs.
- >-
  The HMAC-SHA256 callback signing/verification routine is the highest-risk piece
  of the integration and is currently prose plus a walkthrough. A tiny published
  library that signs and verifies entry links would remove a whole class of
  integration defect.
- >-
  Document the DISQO Pulse Android SDK publicly (Maven coordinate, versioning,
  changelog) or state that it is partner-only. A third-party Capacitor bridge is
  currently the most discoverable artifact about it.
- >-
  Create a public github.com/disqo organization. DISQO runs an engineering blog
  at developer.disqo.com but has no public code presence at all.
